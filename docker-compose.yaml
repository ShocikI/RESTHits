version: "3.9"

services:
  db:
    restart: always
    image: postgres:15-alpine
    container_name: pgsql-hits
    env_file: './.env'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - njoy_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-hits
    depends_on:
      - db
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py seed_data &&
        python manage.py runserver 0.0.0.0:8000
      "
    env_file: ./.env
    ports:
      - 8000:8000
    networks:
      - njoy_network
    volumes:
      - .:/app

networks:
  njoy_network:

volumes:
  postgres_data: 